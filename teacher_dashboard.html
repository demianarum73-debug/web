{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card">
  <h1>Log in</h1>
  <form method="POST">
    <label>Username</label>
    <input type="text" name="username" required autofocus>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit" class="btn">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('register') }}">Register here</a></p>
  <p class="muted small">Default admin: <code>admin</code> / <code>admin123</code></p>
</div>
{% endblock %}
